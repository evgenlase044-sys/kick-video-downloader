# Move to .github/workflows/ci.yml (the automation token had no `workflow` scope).
name: CI
on:
  push:
    branches: [main, "audit/**"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: bash tools/ci_check.sh | tee ci_report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ci-report, path: ci_report.md }
