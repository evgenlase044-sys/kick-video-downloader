[package]
name = "splash_engine"
version = "0.1.0"
edition = "2021"
description = "Frame-accurate short-video rendering engine (ishowsplash-style templates) in pure Rust + ffmpeg I/O"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
